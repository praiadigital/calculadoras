<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Calculadoras Imobiliárias — Praia Digital</title>
<meta name="description" content="Financiamento Price, consórcio e ROI de temporada em um só lugar.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}
  .logo{font-size:1.2rem}
  main{max-width:760px;margin:2rem auto;padding:0 1rem}
  .tabs{display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap}
  .tab{flex:1;min-width:150px;padding:.8rem;border:1px solid #cbd5e1;background:#fff;border-radius:12px;font-weight:700;cursor:pointer;font-size:.9rem}
  .tab.active{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;border-color:transparent}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  .panel{display:none}.panel.active{display:block}
  h1{font-size:1.5rem;color:#0077B6;margin-bottom:1rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button.calc{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  .out{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:1rem;display:none}
  .out b{color:#0369a1}
  footer{background:#023047;color:#cbd5e1;padding:2rem 1.5rem;margin-top:3rem}
  footer h4{color:#fff;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem}
  .links{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem}
  .links a{color:#90E0EF;text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/apps">← Todos os apps</a>
</header>
<main>
  <div class="tabs">
    <button class="tab active" onclick="show(0,this)">🏦 Financiamento</button>
    <button class="tab" onclick="show(1,this)">🤝 Consórcio</button>
    <button class="tab" onclick="show(2,this)">📈 ROI Temporada</button>
  </div>
  <div class="card">
    <div class="panel active">
      <h1>Financiamento (Tabela Price)</h1>
      <label>Valor do imóvel (R$)</label><input type="number" id="fValor" value="500000">
      <label>Entrada (R$)</label><input type="number" id="fEntrada" value="100000">
      <label>Taxa de juros anual (%)</label><input type="number" id="fTaxa" value="10.5" step="0.1">
      <label>Prazo (anos)</label><input type="number" id="fPrazo" value="30">
      <button class="calc" onclick="fin()">Calcular parcela</button>
      <div class="out" id="fOut"></div>
    </div>
    <div class="panel">
      <h1>Consórcio Imobiliário</h1>
      <label>Crédito desejado (R$)</label><input type="number" id="cValor" value="400000">
      <label>Prazo (meses)</label><input type="number" id="cPrazo" value="180">
      <label>Taxa de administração total (%)</label><input type="number" id="cAdm" value="18" step="0.5">
      <button class="calc" onclick="cons()">Calcular parcela</button>
      <div class="out" id="cOut"></div>
    </div>
    <div class="panel">
      <h1>ROI de Aluguel de Temporada</h1>
      <label>Valor do imóvel (R$)</label><input type="number" id="rValor" value="500000">
      <label>Diária média (R$)</label><input type="number" id="rDiaria" value="450">
      <label>Ocupação anual (%)</label><input type="number" id="rOc" value="55">
      <label>Custos anuais — condomínio, IPTU, manutenção (R$)</label><input type="number" id="rCustos" value="18000">
      <button class="calc" onclick="roi()">Calcular retorno</button>
      <div class="out" id="rOut"></div>
    </div>
  </div>
</main>
<footer>
  <h4>Rede de apps Praia Digital</h4>
  <div class="links">
    <a href="https://praia.digital/avaliador-imoveis">Avaliador IA</a>
    <a href="https://praia.digital/calculadora-custos">Custos de Compra</a>
    <a href="https://praia.digital/simulador-credito">Simulador Crédito</a>
    <a href="https://praia.digital/simulador-roi">Simulador ROI</a>
    <a href="https://praia.digital/ferramentas">Kit do Anfitrião</a>
    <a href="https://praia.digital/gerador-descricoes">Gerador de Descrições</a>
    <a href="https://praia.digital/portal-corretores">Portal do Corretor</a>
    <a href="https://praia.digital/guia-litoral">Guia do Litoral</a>
    <a href="https://praia.digital/blog-litoral">Blog</a>
  </div>
</footer>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
var num=function(id){return parseFloat(document.getElementById(id).value)||0};
function show(i,btn){
  document.querySelectorAll('.panel').forEach(function(p,k){p.classList.toggle('active',k===i)});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  btn.classList.add('active');
}
function fin(){
  var P=num('fValor')-num('fEntrada'), i=num('fTaxa')/100/12, n=num('fPrazo')*12;
  var par=P*i/(1-Math.pow(1+i,-n));
  var e=document.getElementById('fOut');
  e.innerHTML='Parcela: <b>'+fmt(par)+'</b>/mês<br>Total pago: '+fmt(par*n)+' · Juros: '+fmt(par*n-P)+'<br>Renda mínima sugerida (30%): <b>'+fmt(par/0.3)+'</b>';
  e.style.display='block';
}
function cons(){
  var v=num('cValor'), n=num('cPrazo'), adm=num('cAdm')/100;
  var par=(v*(1+adm))/n;
  var e=document.getElementById('cOut');
  e.innerHTML='Parcela estimada: <b>'+fmt(par)+'</b>/mês<br>Custo total: '+fmt(v*(1+adm))+' (adm. '+fmt(v*adm)+')<br>Sem juros de financiamento — ideal para planejar a compra.';
  e.style.display='block';
}
function roi(){
  var v=num('rValor'), receita=num('rDiaria')*365*num('rOc')/100, liquida=receita-num('rCustos');
  var pct=liquida/v*100;
  var e=document.getElementById('rOut');
  e.innerHTML='Receita bruta anual: '+fmt(receita)+'<br>Receita líquida: <b>'+fmt(liquida)+'</b><br>ROI anual: <b>'+pct.toFixed(1)+'%</b> · Payback: ~'+(v/liquida).toFixed(1)+' anos';
  e.style.display='block';
}
</script>
</body>
</html>
