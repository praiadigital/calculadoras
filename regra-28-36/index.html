<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regra 28/36 — Saúde Financeira para Financiar — Praia Digital</title>
<meta name="description" content="A regra que os bancos usam: moradia até 28% da renda, dívidas totais até 36%. Teste seu perfil.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:660px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.3rem}
  .gauge{margin-top:.8rem}
  .gtop{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;margin-bottom:.25rem}
  .barra{height:20px;background:#e2e8f0;border-radius:99px;overflow:hidden;position:relative}
  .barra div{height:100%;transition:width .5s}
  .limite{position:absolute;top:0;bottom:0;width:2px;background:#0f172a;opacity:.4}
  .ok{color:#166534}.warn{color:#b45309}.bad{color:#dc2626}
  .dica{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/calculadoras">← Calculadoras</a>
</header>
<main>
  <div class="card">
    <h1>📏 Regra 28/36</h1>
    <p class="sub">O padrão internacional: moradia até 28% da renda bruta, dívidas totais até 36%.</p>
    <label>Renda bruta mensal (R$)</label><input type="number" id="renda" value="9000">
    <label>Parcela de moradia desejada — financiamento + condomínio (R$)</label><input type="number" id="moradia" value="2500">
    <label>Outras dívidas mensais (R$)</label><input type="number" id="dividas" value="600">
    <button onclick="calc()">Avaliar minha saúde financeira</button>
    <div id="out"></div>
    <div class="dica">💳 Detalhe por perfil na <a href="https://praia.digital/simulador-credito/capacidade-parcela/" style="color:#0077B6;font-weight:700">Capacidade de Parcela</a> · 🏦 <a href="https://praia.digital/simulador-credito" style="color:#0077B6;font-weight:700">Simulador de Crédito</a></div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function gauge(nome,pct,limite){
  var cls=pct<=limite*0.85?'ok':pct<=limite?'warn':'bad';
  var cor=pct<=limite*0.85?'#22c55e':pct<=limite?'#f59e0b':'#dc2626';
  var status=pct<=limite*0.85?'✅ Saudável':pct<=limite?'⚠️ No limite':'❌ Acima do recomendado';
  return '<div class="gauge"><div class="gtop"><span>'+nome+'</span><span class="'+cls+'">'+pct.toFixed(0)+'% — '+status+'</span></div><div class="barra"><div style="width:'+Math.min(100,pct/50*100)+'%;background:'+cor+'"></div><div class="limite" style="left:'+(limite/50*100)+'%"></div></div></div>';
}
function calc(){
  var r=parseFloat(document.getElementById('renda').value)||1;
  var m=parseFloat(document.getElementById('moradia').value)||0;
  var d=parseFloat(document.getElementById('dividas').value)||0;
  var p28=m/r*100, p36=(m+d)/r*100;
  document.getElementById('out').innerHTML=gauge('Moradia (regra dos 28%)',p28,28)+gauge('Dívidas totais (regra dos 36%)',p36,36)+
    '<p style="margin-top:1rem;font-size:.92rem">Moradia: '+fmt(m)+' · Outras dívidas: '+fmt(d)+' · Limite moradia para sua renda: <b>'+fmt(r*0.28)+'</b></p>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
