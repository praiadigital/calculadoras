<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juros Compostos Visual — Praia Digital</title>
<meta name="description" content="Veja a bola de neve dos juros compostos: quanto R$ 500/mês viram em 10, 20 e 30 anos.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:700px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  #out{display:none;margin-top:1.3rem}
  .ano{display:flex;align-items:center;gap:.7rem;margin-top:.6rem;font-size:.88rem}
  .ano b{width:60px}
  .trilha{flex:1;height:24px;background:#e2e8f0;border-radius:99px;overflow:hidden}
  .trilha div{height:100%;background:linear-gradient(90deg,#0077B6,#22c55e);display:flex;align-items:center;justify-content:flex-end;padding-right:.6rem;color:#fff;font-size:.75rem;font-weight:700;min-width:80px}
  .dica{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/calculadoras">← Calculadoras</a>
</header>
<main>
  <div class="card">
    <h1>❄️ A Bola de Neve dos Juros Compostos</h1>
    <p class="sub">A mesma disciplina que paga um financiamento pode construir sua entrada — ou seu patrimônio.</p>
    <div class="grid">
      <div><label>Aporte mensal (R$)</label><input type="number" id="aporte" value="800"></div>
      <div><label>Rendimento (% ao ano)</label><input type="number" id="taxa" value="10" step="0.5"></div>
    </div>
    <button onclick="calc()">Ver a bola de neve</button>
    <div id="out"></div>
    <div class="dica">💵 Juntando para a entrada? Simule o tamanho ideal na <a href="https://praia.digital/calculadora-custos/entrada-ideal/" style="color:#0077B6;font-weight:700">Entrada Ideal</a>.</div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})};
function calc(){
  var a=parseFloat(document.getElementById('aporte').value)||0;
  var r=parseFloat(document.getElementById('taxa').value)/100;
  var i=Math.pow(1+r,1/12)-1;
  var anos=[1,3,5,10,15,20,30], h='', max=0, vals=[];
  anos.forEach(function(y){
    var n=y*12, f=a*((Math.pow(1+i,n)-1)/i);
    vals.push([y,f,a*n]); if(f>max)max=f;
  });
  vals.forEach(function(v){
    h+='<div class="ano"><b>'+v[0]+' ano'+(v[0]>1?'s':'')+'</b><div class="trilha"><div style="width:'+(v[1]/max*100)+'%">'+fmt(v[1])+'</div></div></div>';
  });
  var ult=vals[vals.length-1];
  h+='<p style="margin-top:1rem;font-size:.92rem">Em 30 anos: você aportou '+fmt(ult[2])+' e os juros geraram <b style="color:#166534">'+fmt(ult[1]-ult[2])+'</b> — '+Math.round((ult[1]-ult[2])/ult[2]*100)+'% a mais que o aportado.</p>';
  document.getElementById('out').innerHTML=h;
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
