<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reajuste de Aluguel (IPCA/IGP-M) — Praia Digital</title>
<meta name="description" content="Calcule o novo valor do aluguel após o reajuste anual por IPCA ou IGP-M.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:640px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  .res{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1.25rem;text-align:center;display:none}
  .res b{font-size:1.8rem;color:#0369a1;display:block}
  .linha{display:flex;justify-content:space-between;font-size:.9rem;padding:.35rem 0;color:#475569}
  .dica{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/calculadoras">← Calculadoras</a>
</header>
<main>
  <div class="card">
    <h1>📈 Reajuste Anual de Aluguel</h1>
    <p class="sub">Aniversário do contrato? Calcule o novo valor em segundos.</p>
    <label>Aluguel atual (R$)</label><input type="number" id="aluguel" value="2000">
    <label>Índice do contrato</label>
    <select id="indice">
      <option value="4.4">IPCA — últimos 12 meses (~4,4%)</option>
      <option value="3.8">IGP-M — últimos 12 meses (~3,8%)</option>
      <option value="custom">Outro índice (informar)</option>
    </select>
    <label id="lcustom" style="display:none">Índice acumulado (%)</label>
    <input type="number" id="custom" value="5" step="0.1" style="display:none">
    <button onclick="calc()">Calcular novo aluguel</button>
    <div class="res" id="out"></div>
    <div class="dica">🏠 Investidor? Compare com a temporada no <a href="https://praia.digital/simulador-roi/airbnb-vs-anual/" style="color:#0077B6;font-weight:700">Airbnb vs Anual</a>.</div>
  </div>
</main>
<script>
var fmt=function(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2})};
document.getElementById('indice').onchange=function(){
  var c=this.value==='custom';
  document.getElementById('custom').style.display=c?'block':'none';
  document.getElementById('lcustom').style.display=c?'block':'none';
};
function calc(){
  var a=parseFloat(document.getElementById('aluguel').value)||0;
  var sel=document.getElementById('indice');
  var i=sel.value==='custom'?parseFloat(document.getElementById('custom').value)||0:parseFloat(sel.value);
  var novo=a*(1+i/100);
  document.getElementById('out').innerHTML=
    'Novo aluguel mensal<b>'+fmt(novo)+'</b>'+
    '<div class="linha"><span>Reajuste ('+i+'%)</span><span>+'+fmt(novo-a)+'/mês</span></div>'+
    '<div class="linha"><span>Impacto anual</span><span>+'+fmt((novo-a)*12)+'/ano</span></div>';
  document.getElementById('out').style.display='block';
}
</script>
</body>
</html>
